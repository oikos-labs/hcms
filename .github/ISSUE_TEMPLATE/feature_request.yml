name: Feature request
description: Suggest a new feature or improvement.
title: "Feature: "
labels: [enhancement]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please provide as much detail as possible.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Provide a short description of the feature request.
      placeholder: A clear and concise description of the requested feature.
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed?
      placeholder: Describe the problem this feature solves.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: Describe what you would like to happen.
      placeholder: Outline the new behavior or UI.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Optional details, examples, or related context.
      placeholder: Screenshots, links, or use cases.
