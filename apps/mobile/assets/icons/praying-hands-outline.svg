<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img">
  <title>Overlapping hands</title>
  <desc>Two overlapping hand outlines using the supplied Ionicon hand geometry.</desc>
  <defs>
    <path id="finger-right" d="M432 320V144a32 32 0 0 0-32-32h0a32 32 0 0 0-32 32v112"/>
    <path id="finger-mid-right" d="M368 256V80a32 32 0 0 0-32-32h0a32 32 0 0 0-32 32v160"/>
    <path id="finger-left" d="M240 241V96a32 32 0 0 0-32-32h0a32 32 0 0 0-32 32v224"/>
    <path id="finger-mid-left" d="M304 240V48a32 32 0 0 0-32-32h0a32 32 0 0 0-32 32v192"/>
    <path id="palm" d="M432 320c0 117.4-64 176-152 176s-123.71-39.6-144-88L83.33 264c-6.66-18.05-3.64-34.79 11.87-43.6h0c15.52-8.82 35.91-4.28 44.31 11.68L176 320"/>
  </defs>

  <!-- Visible portions of the rear hand, cut directly from the same source paths. -->
  <g transform="translate(-10 0) scale(.9)" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32">
    <g transform="rotate(45 256 256)">
      <path d="M196.5986 478.6836C165.6943 462.6125 148.1036 436.872 136 408L83.33 264C76.67 245.95 79.69 229.21 95.2 220.4"/>
      <path d="M177.7939 85.4364A32 32 0 0 0 176 96V188.5313"/>
    </g>
  </g>

  <!-- Front hand: exact supplied geometry. -->
  <g transform="translate(28 24) scale(.9)" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32">
    <g transform="rotate(45 256 256)">
      <use href="#finger-right"/>
      <use href="#finger-mid-right"/>
      <use href="#finger-left"/>
      <use href="#finger-mid-left"/>
      <use href="#palm"/>
    </g>
  </g>
</svg>
